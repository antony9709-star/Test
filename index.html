<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마지막 편지 | 작품 소개</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", sans-serif;
      line-height: 1.8;
    }

    main {
      max-width: 640px;
      min-height: 100svh;
      margin: auto;
      padding: 64px 24px 32px;
      display: flex;
      flex-direction: column;
    }

    .label {
      color: #a9beff;
      font-size: 13px;
      letter-spacing: 3px;
    }

    h1 {
      margin: 18px 0;
      font-size: clamp(36px, 8vw, 52px);
      line-height: 1.3;
    }

    .intro { color: #ccc; font-size: 18px; }

    details {
      margin-top: 32px;
      padding: 20px;
      border: 1px solid #383838;
      border-radius: 14px;
      background: #101010;
    }

    summary { cursor: pointer; font-weight: 600; }

    details p { color: #ccc; }

    .author {
      margin: 24px 0 48px;
      color: #999;
      font-size: 14px;
    }

    .purchase {
      margin-top: auto;
      padding-top: 28px;
      border-top: 1px solid #303030;
      text-align: center;
    }

    .purchase h2 { margin: 0; font-size: 20px; }

    .purchase p {
      margin: 8px 0 20px;
      color: #aaa;
      font-size: 14px;
    }

    .payment-link {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 16px;
      color: #fff;
      text-decoration: none;
      transition: background 0.2s;
    }

    .payment-link:hover { background: #191919; }

    .payment-link:focus-visible,
    summary:focus-visible {
      outline: 3px solid #a9beff;
      outline-offset: 5px;
    }

    .payment-link img {
      display: block;
      width: 120px;
      height: auto;
    }

    .payment-link span { font-size: 14px; }

    .notice {
      margin-top: 24px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main>
    <section aria-labelledby="title">
      <p class="label">ORIGINAL SCREENPLAY</p>

      <h1 id="title">마지막 편지</h1>

      <p class="intro">
        도착하지 않아야 할 편지 한 통이 그의 일상을 바꾼다.
      </p>

      <details>
        <summary>작품 소개 읽기</summary>
        <p>
          오래된 집을 정리하던 주인공은
          미래의 자신이 보낸 편지를 발견한다.
        </p>
        <p>
          편지에는 내일 일어날 일이 적혀 있다.<br>
          그리고 마지막 줄에는 짧은 경고가 남아 있다.<br>
          “그 문을 열지 마.”
        </p>
      </details>

      <p class="author">각본 · 홍길동 / 공개 준비 중</p>
    </section>

    <footer class="purchase">
      <h2>작품 구매</h2>
      <p>아래 이미지를 눌러 테스트 결제 화면을 확인하세요.</p>

      <a class="payment-link" href="./payment.html">
        <img src="./Mastercard.png" alt="Mastercard">
        <span>테스트 결제 페이지로 이동 →</span>
      </a>

      <div class="notice">
        연습용 화면입니다. 실제 결제 기능은 연결되어 있지 않습니다.
      </div>
    </footer>
  </main>
</body>
</html>
