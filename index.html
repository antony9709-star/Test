<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 첫 작품</title>
  <style>
    body {
      margin: 0;
      padding: 70px 24px;
      background: #141822;
      color: #ffffff;
      font-family: sans-serif;
      line-height: 1.8;
    }
    main { max-width: 600px; margin: auto; }
    h1 { font-size: 42px; line-height: 1.3; }
    .label { color: #9cb7ff; }
    details {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #59647b;
      border-radius: 12px;
    }
    summary { cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <p class="label">ORIGINAL SCREENPLAY</p>
    <h1>마지막 편지</h1>
    <p>도착하지 않아야 할 편지 한 통이 그의 일상을 바꾼다.</p>

    <details>
      <summary>작품 소개 읽기</summary>
      <p>
        오래된 집을 정리하던 주인공은
        미래의 자신이 보낸 편지를 발견한다.
      </p>
    </details>

    <p>각본 · 홍길동 / 공개 준비 중</p>
  </main>
</body>
</html>
